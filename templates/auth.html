{% extends "base.html" %}{% block title %}{{ 'Sign up' if mode=='signup' else 'Log in' }}{% endblock %}{% block body %}
<div class=card style="max-width:420px;margin:30px auto"><h1>{{ 'Create your account' if mode=='signup' else 'Welcome back' }}</h1>
<form method=post><label>Email</label><input type=email name=email required autocomplete=email>
<label>Password {% if mode=='signup' %}(8+ characters){% endif %}</label><input type=password name=password required minlength=8>
<button style="width:100%">{{ 'Sign up' if mode=='signup' else 'Log in' }}</button></form>
<p class=mute>{% if mode=='signup' %}Have an account? <a href="/login">Log in</a>{% else %}New here? <a href="/signup">Sign up</a>{% endif %}</p></div>
{% endblock %}
